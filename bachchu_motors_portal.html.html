<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাচ্চু মটরস - ডিজিটাল হাজিরা ও স্টাফ পোর্টাল</title>
    
    <!-- PWA & Home Screen Meta Tags (হোমস্ক্রিনে অ্যাড করার জন্য নতুন যোগ করা হলো) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="বাচ্চু মটরস">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Bengali Font (Hind Siliguri) -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for Admin Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background-color: #f8fafc;
            position: relative;
        }
        /* Subtly Watermarked Background Logo */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="%23fbbf24" stroke-width="15"/><text x="50%" y="55%" font-size="65" font-weight="bold" fill="%23dc2626" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">BM</text></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 380px;
            opacity: 0.035;
            z-index: -1;
            pointer-events: none;
        }

        #toastBox { transition: all 0.4s ease-in-out; }

        @keyframes scaleUp {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-tick-anim { animation: scaleUp 0.4s ease-in-out forwards; }

        @keyframes bikeRun {
            0% { left: -110px; transform: scaleX(1); }
            48% { left: calc(100% + 20px); transform: scaleX(1); }
            50% { left: calc(100% + 20px); transform: scaleX(-1); }
            98% { left: -110px; transform: scaleX(-1); }
            100% { left: -110px; transform: scaleX(1); }
        }

        @keyframes spinWheel {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .bike-runner { animation: bikeRun 4s infinite linear; }
        .wheel-spinner { animation: spinWheel 0.35s infinite linear; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- (আপনার কোডের বাকি সমস্ত এইচটিএমএল, ডিজাইন, প্যানেল এবং মূল স্ক্রিপ্ট এখানে অপরিবর্তিত থাকবে) -->

    <!-- কোডের একদম শেষে বা স্ক্রিপ্ট সেকশনের নিচে সার্ভিস ওয়ার্কার রেজিস্টার করার জন্য এটি যোগ করুন -->
    <script>
        // Service Worker Registration for PWA / Mobile App installation
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('App Service Worker Registered', reg.scope))
                    .catch((err) => console.log('Service Worker Failed', err));
            });
        }
    </script>
</body>
</html>
